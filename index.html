<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fast Frank - Fix the Blue Man</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧞</text></svg>"/>
    
    <link rel="stylesheet" href="./css/main.css"/>
    
    <script src="./js/neodrag.js"></script>
    <script src="./js/mersenne.js"></script>
    
    <!-- All items/* images are credit to Kenney @ www.kenney.nl specifically https://kenney.nl/assets/generic-items - thanks for a great pack-->
    <script src="./js/items.js" defer></script>
    <script src="./js/util.js"></script>
  </head>
  <body>
    <div id="overlayMessageWrap">
      <div id="overlayMessage"></div>
      <div id="newGameButton" class="centered hide">
        <!-- TODO Add a "Submit Score" checkbox, that does ntfy.sh, but ONLY on win -->
        <button onclick="util.removeUrlParam('seed', true);" title="New game with a new seed">New</button>
        <button onclick="util.removeUrlParam(null, true);" title="Restart the game with the same seed">Restart</button>
      </div>
    </div>
    
    <details id="configOuter">
      <summary>Configuration and Setup</summary>
      <div id="configWrap">
        <b>Map Size</b><br/>
        <label>
          Width:
          <input id="mapWidthIn"></input>
        </label>
        <label>
          Height:
          <input id="mapHeightIn"></input>
        </label>
      </div>
    </details>
    
    <!-- Sometimes it's nice to feel like 1990 an use table for layout -->
    <table id="scoreWrap">
      <tr>
        <td style="text-align: left; height: 45px;">
          <span id="scoreCounter">&nbsp;</span>
          <span id="scoreMessage" class="scoreMessageRed"></span>
        </td>
        <td id="gameButtons" style="text-align: right;">
          <button onclick="util.removeUrlParam('seed', true);" title="New game with a new seed">New</button>
          <button onclick="util.removeUrlParam(null, true);" title="Restart the game with the same seed">Restart</button>
          <button onclick="stopGame(true);" title="Quit, like you do for everything in your life">Give Up</button>
        </td>
      </tr>
    </table>
    
    <div id="map">
      <div id="doll" class="centered">
        <img id="dollHead" src="./blueman/doll-head.png" draggable="false" class="dollDrop" style="top: 0; left: 128px;"></img>
        <img id="dollArmPort" src="./blueman/doll-arm-port.png" draggable="false" class="dollDrop" style="top: 85px; left: 30px;"></img>
        <img id="dollTorso" src="./blueman/doll-torso.png" draggable="false" class="dollDrop" style="top: 76px; left: 117px;"></img>
        <img id="dollArmStarboard" src="./blueman/doll-arm-starboard.png" draggable="false" class="dollDrop" style="top: 85px; left: 199px;"></img>
        <img id="dollLegPort" src="./blueman/doll-leg-port.png" draggable="false" class="dollDrop" style="top: 206px; left: 90px;"></img>
        <img id="dollGroin" src="./blueman/doll-groin.png" draggable="false" class="dollDrop" style="top: 206px; left: 153px;"></img>
        <img id="dollLegStarboard" src="./blueman/doll-leg-starboard.png" draggable="false" class="dollDrop" style="top: 206px; left: 163px;"></img>
      </div>
      <div id="infoWrap" class="centered">
        &nbsp;
      </div>
    </div>
    
    <script>
      const queryParams = new URLSearchParams(window.location.search);
      
      const DEBUG = queryParams.get("debug") ?? false;
      const BLUEMAN_SEED = queryParams.get("seed") ?? new Date().getTime();
      const BLUEMAN_DIR = "blueman/";
      const BLUEMAN_EXT = ".png";
      const COLLISION_SAFE_GAP_PX = 0.5;
      const ITEM_MOVE_SPEED_TO_MOUSE = 1;
      const ITEM_MOVE_SPEED_TO_PIECE = 3;
      const ITEM_MOVE_INTERVAL_MS = 20;
      
      // Add our seed to the URL
      util.addUrlParam("seed", BLUEMAN_SEED);
      
      const rand = new MersenneTwister(BLUEMAN_SEED);
      
      const state = {
        mapWidth: 1000,
        mapHeight: 700,
        paused: false, // If we lose visibility pause our timer
        currentZIndex: 3, // Layer last dragged object to the top, so keep a running tally
        // TODO Decide if we want a countdown OR just start the timer on the first drag (cleaner)
        currentCountdown: 3, // Start countdown
        scoreInterval: null, // setInterval for score countdown
        score: {
          total: 0,
          itemPenalty: 0,
          dropPenalty: 0,
          dropWorst: 0,
          dropBest: null,
        },
        // Track what piece was matched last
        lastPiece: {
          element: null,
          penalty: 0
        },
        isDragging: false,
        lastMouseX: null,
        lastMouseY: null,
        attackingItem: null,
        attackingItemInterval: null,
      };
      const elements = {
        map: document.getElementById("map"),
        mapWidthIn: document.getElementById("mapWidthIn"),
        mapHeightIn: document.getElementById("mapHeightIn"),
        doll: document.getElementById("doll"),
        overlayMessageWrap: document.getElementById("overlayMessageWrap"),
        overlayMessage: document.getElementById("overlayMessage"),
        infoWrap: document.getElementById("infoWrap"),
        scoreCounter: document.getElementById("scoreCounter"),
        scoreMessage: document.getElementById("scoreMessage"),
      };
      // Track both the image names, and true/false if they have been detected as dropped
      // This is used for determining winning
      const dollPieces = {
        "doll-head": false,
        "doll-arm-port": false,
        "doll-torso": false,
        "doll-arm-starboard": false,
        "doll-leg-port": false,
        "doll-leg-starboard": false
      };
      // Groin is sometimes optional
      if (util.getRandomFloat() < 0.25) {
        dollPieces["doll-groin"] = false;
      }
      
      function handleDrop(dragEvent) {
        state.isDragging = false;
        stopAttacking();
        
        const droppedOn = document.elementsFromPoint(dragEvent.event.clientX, dragEvent.event.clientY);
        
        droppedOn.forEach(dropped => {
          if (dropped.classList.contains("dollDrop")) {
            const dragRect = dragEvent.currentNode.getBoundingClientRect();
            const dropRect = dropped.getBoundingClientRect();
            const deltaX = dragRect.x - dropRect.x;
            const deltaY = dragRect.y - dropRect.y;
            
            // Track that we dropped this piece, if it matches, and then check win condition
            const dragKey = getKeyFromSrc(dragEvent.currentNode.src);
            const dropKey = getKeyFromSrc(dropped.src);
            if (dragKey === dropKey && dollPieces.hasOwnProperty(dragKey)) {
              // Penalize based on how far off the drop was
              const penalty = Math.abs(deltaX) + Math.abs(deltaY);
              
              if (penalty !== 0) {
                elements.infoWrap.textContent = `Off By: X=${deltaX}, Y=${deltaY}`;
              }
              
              doDropMatchedPiece(penalty, dragEvent.currentNode);
              
              if (Object.values(dollPieces).every(val => val === true)) {
                stopGame();
              }
            }
          }
        });
      }
      
      function doDropMatchedPiece(penalty, dropPiece) {
        const isDecoy = dropPiece.classList.contains("decoy");
        
        if (isDecoy) {
          penalty = 10;
          elements.scoreMessage.textContent = `Bamboozled by Decoy +${penalty}s`; // Thanks a lot Apex Mirage
        }
        else {
          elements.scoreMessage.textContent = penalty === 0 ? `Perfect` : `+${penalty}s`;
        }
        
        state.score.total += penalty;
        state.score.dropPenalty += penalty;
        state.score.dropWorst = Math.max(state.score.dropWorst, penalty);
        state.score.dropBest = Math.min(state.score.dropBest ?? Infinity, penalty);
        
        if (isDecoy) {
          dropPiece.style.display = "none";
          dropPiece.style.pointerEvents = "none";
          return;
        }
        
        dollPieces[getKeyFromSrc(dropPiece.src)] = true;
        
        dropPiece.style.pointerEvents = "none"; // Disable further interaction
        dropPiece.style.filter = "none";
        
        state.lastPiece.element = dropPiece;
        state.lastPiece.penalty = penalty;
      }
      
      function undoDropMatchedPiece() {
        if (state.lastPiece.element) {
          elements.scoreMessage.textContent = `-${state.lastPiece.penalty}s Undo`;
          
          state.score.total -= state.lastPiece.penalty;
          state.score.dropPenalty -= state.lastPiece.penalty;
          
          dollPieces[getKeyFromSrc(state.lastPiece.element.src)] = false;
          
          state.lastPiece.element.style.pointerEvents = "auto";
          state.lastPiece.element.style.filter = `hue-rotate(${util.getRandomInt(10, 350)}deg)`;
          
          // Better highlight what piece was made active again
          state.lastPiece.element.style.outline = "5px solid goldenrod";
          const toBorder = state.lastPiece.element;
          setTimeout(() => {
            toBorder.style.outline = "none";
          }, 1000);
          
          state.lastPiece.element = null;
          state.lastPiece.penalty = 0;
          
          return true;
        }
        return false;
      }
      
      function getKeyFromSrc(pieceSrc) {
        return pieceSrc.substring(pieceSrc.lastIndexOf(BLUEMAN_DIR) + BLUEMAN_DIR.length, pieceSrc.length - BLUEMAN_EXT.length);
      }
      
      function startAttacking() {
        // Clear any current attack, just in case
        stopAttacking();
        
        // Chance we don't have a valid item, in which case we do nothing
        state.attackingItem = items.getRandomItem(true);
        if (state.attackingItem) {
          // Normally we just attack the mouse, but sometimes go to a random viable piece for variety
          let targetPiece = null;
          if (util.getRandomFloat() < 0.4) {
            // Some transformation going on here
            // Get all active pieces, aka those that haven't been "locked in" on the doll
            // Then choose a random piece from that
            // Finally translate the piece into a matching element in the page
            const activePieces = Object.entries(dollPieces).filter(doll => !doll[1]);
            const chosenPiece = util.getRandomItemFromArray(activePieces);
            targetPiece = [...document.getElementsByClassName("piece")].find(ele => ele.src.includes(chosenPiece[0]));
          }
          
          state.attackingItemInterval = setInterval(() => {
            let targetX = state.lastMouseX;
            let targetY = state.lastMouseY;
            let moveSpeed = ITEM_MOVE_SPEED_TO_MOUSE;
            if (targetPiece) {
              targetX = parseInt(targetPiece.style.left);
              targetY = parseInt(targetPiece.style.top);
              moveSpeed = ITEM_MOVE_SPEED_TO_PIECE;
            }
            
            let itemLeft = parseInt(state.attackingItem.element.style.left);
            let itemTop = parseInt(state.attackingItem.element.style.top);
            
            if (itemLeft > targetX) {
              itemLeft -= Math.min(itemLeft - targetX, moveSpeed);
            }
            else if (itemLeft < targetX) {
              itemLeft += Math.min(itemLeft + targetX, moveSpeed);
            }
            
            if (itemTop > targetY) {
              itemTop -= Math.min(itemTop - targetY, moveSpeed);
            }
            else if (itemTop < targetY) {
              itemTop += Math.min(itemTop + targetY, moveSpeed);
            }
            
            // Check everything as the item could be cleared before we act
            if (state.attackingItem) {
              state.attackingItem.element.style.left = itemLeft + "px";
            }
            if (state.attackingItem) {
              state.attackingItem.element.style.top = itemTop + "px";
            }
            if (state.attackingItem) {
              // Reset our cached position
              state.attackingItem.boundingRect = null;
            }
          }, ITEM_MOVE_INTERVAL_MS);
        }
      }
      
      function stopAttacking() {
        state.attackingItem = null;
        if (state.attackingItemInterval) {
          clearInterval(state.attackingItemInterval);
          state.attackingItemInterval = null;
        }
      }
      
      function createPiece(imgPath, isDecoy = false) {
        const minX = elements.map.offsetLeft;
        const minY = elements.map.offsetTop;
        const maxX = minX + state.mapWidth;
        const maxY = minY + state.mapHeight;
        
        const newPiece = document.createElement("img");
        newPiece.src = imgPath;
        newPiece.draggable = false; // Turn off built-in browser image dragging
        newPiece.className = "piece";
        newPiece.style.filter = `hue-rotate(${util.getRandomInt(10, 350)}deg)`;
        
        if (isDecoy) {
          newPiece.className += " decoy";
          newPiece.style.filter += " drop-shadow(0 0 1px cornflowerblue)";
        }
        
        elements.map.appendChild(newPiece);
        randomizePiecePosition(newPiece);
        
        let lastValidPosition = { x: 0, y: 0 };
        
        const neodrag = new NeoDrag.Draggable(newPiece, {
          bounds: "parent",
          position: { ...lastValidPosition },
          onDragStart: (data) => {
            state.currentZIndex++;
            data.currentNode.style.zIndex = state.currentZIndex;
            elements.infoWrap.textContent = "";
            
            state.isDragging = true;
            
            // Most of the time choose a random item and have it start moving towards our mouse...
            // The MOUSE, specifically NOT towards the piece, as then we have to do position + translate math and boundingRect needlessly
            // TODO Also consider just randomly startAttacking if the user is idle for a while, aka no drag start for X seconds
            if (util.getRandomFloat() < 0.75) {
              startAttacking();
            }
          },
          onDrag: (data) => {
            const candidate = {
              x: data.offsetX,
              y: data.offsetY,
            };

            const start = { ...lastValidPosition };
            const startRect = data.currentNode.getBoundingClientRect();
            const dx = candidate.x - start.x;
            const dy = candidate.y - start.y;

            let isHit = Infinity;
            for (const checkItem of items.all) {
              // Cache our item position if we haven't already
              if (!checkItem.boundingRect) {
                checkItem.boundingRect = checkItem.element.getBoundingClientRect();
              }
              
              // Check collision during the move
              const hitTime = util.sweptAabbHitTime(
                startRect,
                dx,
                dy,
                checkItem.boundingRect
              );
              
              // BOOM collide
              if (hitTime !== null && hitTime < isHit) {
                isHit = hitTime;
                
                // If the collision was with a usable item, consume it now and be done with the entire process
                if (!checkItem.isWall) {
                  checkItem.onHit(data.currentNode, checkItem);
                  return;
                }
                
                // Can't find an earlier collision
                if (isHit === 0) {
                  break;
                }
              }
            }

            // If we DON'T have a collision, just update and allow the move and bail
            if (isHit === Infinity) {
              lastValidPosition = candidate;
              return;
            }
            
            // Stop slightly before the collision, so that we don't get "stuck" on the item
            const maxDelta = Math.max(Math.abs(dx), Math.abs(dy));
            const safeT = maxDelta > 0 ? Math.max(0, isHit - COLLISION_SAFE_GAP_PX / maxDelta) : 0;
            
            // We need to apply the incoming translation (as Neodrag hasn't yet) to the last "safe" position
            lastValidPosition = {
              x: start.x + dx * safeT,
              y: start.y + dy * safeT,
            };
            neodrag.updateOptions({
              position: { ...lastValidPosition },
            });
          },
          onDragEnd: handleDrop
        });
      }
      
      function randomizePiecePosition(pieceEle, iteration = 0, isAllowOverlapWithItem = false) {
        pieceEle.style.left = util.getRandomInt(0, state.mapWidth) + "px";
        pieceEle.style.top = util.getRandomInt(0, state.mapHeight) + "px";
        
        // Bound the piece to the map
        if (parseInt(pieceEle.style.left) + pieceEle.width > state.mapWidth) {
          pieceEle.style.left = state.mapWidth - pieceEle.width + "px";
        }
        if (parseInt(pieceEle.style.top) + pieceEle.height > state.mapHeight) {
          pieceEle.style.top = state.mapHeight - pieceEle.height + "px";
        }
        
        // TODO TELEPORT Bug still, when hitting a Steering Wheel for Teleport, the next click to drag "jumps" as if offset/translated right away, when this line is uncommented
        // Likely need to apply current .translate to our left/top style BEFORE calculating bounds? Or rather not apply it, but calculate bounds with left+translate, then adjust position accordingly
        // pieceEle.style.translate = "0px";
        
        // Determine if we placed over any items, and move our piece if we have
        const ourRect = pieceEle.getBoundingClientRect();
        let lastItemOverlap = null;
        for (const checkItem of items.all) {
          if (!checkItem.boundingRect) {
            checkItem.boundingRect = checkItem.element.getBoundingClientRect();
          }
          
          if (util.checkOverlapBounds(ourRect, checkItem.boundingRect)) {
            lastItemOverlap = checkItem.element;
          }
        }
        
        if (lastItemOverlap) {
          iteration++;
          
          // Prevent a potential infinite loop, if we've tried 200 times, just remove the last item we hit and start over
          if (iteration > 300) {
            items.removeItem(lastItemOverlap);
            iteration = 0;
          }
          
          randomizePiecePosition(pieceEle, iteration);
        }
      }
      
      function startGame() {
        elements.map.style.visibility = "visible";
        elements.overlayMessageWrap.style.visibility = "hidden";
        
        state.scoreInterval = setInterval(() => {
          if (!state.paused) {
            state.score.total += 0.02;
            elements.scoreCounter.textContent = state.score.total.toFixed(2);
          }
        }, 20);
      }
      
      function stopGame(gaveUp) {
        if (state.scoreInterval) {
          clearInterval(state.scoreInterval);
        }
        
        util.changeClassList("scoreMessage", {
          scoreMessageBlue: true,
          scoreMessageRed: false
        });
        elements.scoreMessage.textContent =
          `(${state.score.dropPenalty} was penalty [${state.score.dropBest ?? 0} best, ${state.score.dropWorst} worst], ${(state.score.total - state.score.itemPenalty - state.score.dropPenalty).toFixed(2)} was draggin')`;
        elements.infoWrap.textContent = "";
        
        // After the interval stops we update the page text
        elements.overlayMessageWrap.style.visibility = "visible";
        elements.map.style.pointerEvents = "none";
        // Clean up any lingering effects
        elements.map.style.removeProperty("filter");
        elements.map.style.removeProperty("transform");
        
        setTimeout(() => {
          const endMessage = gaveUp ?
            "You quit!\n" + getLoseMessage() :
            "You won!\n" + getWinMessage();
          
          elements.overlayMessage.textContent = endMessage;
          util.changeClassList("gameButtons", {
            hide: true
          });
          util.changeClassList("newGameButton", {
            show: true,
            hide: false
          });
        });
      }
      
      function getWinMessage() {
        // TODO Win messages randomly
        return "Everyone is proud of you";
      }
      
      function getLoseMessage() {
        // TODO Loss messages randomly
        return "What a loser";
      }
      
      function init() {
        document.addEventListener("visibilitychange", (event) => {
          state.paused = !state.paused;
        });
        
        document.addEventListener("mousemove", (event) => {
          // Since our items are intentionally bound to the map, we want to include the offset for our coordinates
          state.lastMouseX = event.clientX - elements.map.offsetLeft;
          state.lastMouseY = event.clientY - elements.map.offsetTop;
        });
        
        elements.map.style.background = `radial-gradient(circle, ${util.getRandomRGBA()} 0%, ${util.getRandomRGBA()} 100%)`;
        elements.map.style.borderColor = util.getRandomColor();
        
        // TODO Need to move our config to a separate screen, and have the map dimensions apply on submit only, before we gen body locations
        const updateMapDimensions = () => {
          elements.map.style.width = state.mapWidth + "px";
          elements.map.style.height = state.mapHeight + "px";
        };
        updateMapDimensions();
        
        elements.mapWidthIn.value = state.mapWidth;
        elements.mapHeightIn.value = state.mapHeight;
        elements.mapWidthIn.addEventListener("input", e => {
          state.mapWidth = e.target.value;
          updateMapDimensions();
        });
        elements.mapHeightIn.addEventListener("input", e => {
          state.mapHeight = e.target.value;
          updateMapDimensions();
        });
        
        // Start with our items, this is so we can double check that no pieces then overlap with them
        items.placeItems();
        
        // Setup the pieces of the blue man across the map
        // NOTE we have to put this in a setTimeout so the items can render first and we can check overlap
        setTimeout(() => {
          Object.keys(dollPieces).forEach((piece) => {
            createPiece(`${BLUEMAN_DIR}${piece}${BLUEMAN_EXT}`);
          });
          
          // Potentially create a DECOY piece
          if (util.getRandomFloat() < 0.4) {
            const dollPiecesAsList = Object.keys(dollPieces);
            const decoyPiece = util.getRandomItemFromArray(dollPiecesAsList);
            createPiece(`${BLUEMAN_DIR}${decoyPiece}${BLUEMAN_EXT}`, true);
          }
          
          // Remove any walls overlapping with the doll, so we have a clear space to move
          const itemsToRemove = [];
          for (const checkItem of items.all) {
            if (checkItem.isWall && util.checkOverlap(elements.doll, checkItem.element)) {
              itemsToRemove.push(checkItem.element);
            }
          }
          itemsToRemove.forEach(toRemove => items.removeItem(toRemove));
          
          // Start the countdown or just rip 'er
          if (DEBUG) {
            startGame();
          }
          else {
            elements.overlayMessage.textContent = state.currentCountdown;
            const countdownInterval = setInterval(() => {
              state.currentCountdown--;
              
              if (state.currentCountdown <= 0) {
                startGame();
                
                if (countdownInterval) {
                  clearInterval(countdownInterval);
                }
              }
              else {
                elements.overlayMessage.textContent = state.currentCountdown;
              }
            }, 999);
          }
        }, 100);
      }
      
      addEventListener("DOMContentLoaded", (event) => {
        init();
      });
    </script>
  </body>
</html>
