<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fast Frank - Fix the Blue Man</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧞</text></svg>"/>
    
    <!-- TODO Do we even need Supastate realistically? Note currently on a Ctrl+Shift+R hard refresh the limbs generate outside the map box -->
    <script src="js/supastate.js"></script>
    <script src="js/detect-transparency-image.js"></script>
    
    <style>
      html, body {
        padding: 0;
        margin: 0;
      }
      
      body {
        overflow: scroll;
        background-color: black;
        color: #DEDEDE;
      }
      
      body, input, button {
        font-family: monospace;
      }
      
      button {
        padding: 10px;
        border: 3px dashed pink;
        border-radius: 10px;
        background-color: darkmagenta;
        box-shadow: 0 0 10px red;
        color: white;
        text-shadow: 0 0 5px black;
        transition: background-color 500ms;
        cursor: grab;
      }
      
      button:hover {
        background-color: magenta;
        border-style: dotted;
      }
      
      .centered {
        text-align: center;
        margin-left: auto;
        margin-right: auto;
      }
      
      #map {
        visibility: hidden; /* Will show after start countdown */
        position: relative;
        background-color: darkslateblue;
        border: 5px groove goldenrod;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 10px;
      }
      
      #configOuter {
        cursor: pointer;
        margin: 10px;
      }
      
      #configWrap {
        margin: 20px;
      }
      
      #infoWrap {
        font-size: smaller;
        text-shadow: 0 0 3px black;
      }
      
      .piece {
        position: absolute;
        user-select: none;
        opacity: 0.9;
      }
      
      .piece:hover {
        /* Important to override color hue rotate inline on each piece */
        filter: drop-shadow(cornflowerblue 0 0 30px) !important;
      }
      
      .doll {
        position: relative;
        width: 256px;
        height: 354px;
      }
      
      .dollDrop {
        filter: brightness(0);
        user-select: none;
        position: absolute;
      }
      
      #scoreWrap, #scoreBar {
        height: 10px;
      }
      
      #scoreWrap {
        background-color: black;
        width: 100%;
      }
      
      #scoreBar {
        font-size: 10px;
        color: black;
        text-shadow: 0 0 2px white;
        transition: width linear 999ms;
        width: 0%;
        background: #2A7B9B;
        background: linear-gradient(90deg,rgba(237, 221, 83, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(42, 123, 155, 1) 100%);
        border-right: 1px solid yellow;
      }
      
      #overlayMessageWrap {
        background-color: black;
        border-radius: 20px;
        border: 1px solid gray;
        box-shadow: 10px 10px 5px navy;
        opacity: 0.9;
        padding: 40px;
        z-index: 9999;
        position: absolute;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: xx-large;
        animation: dvd-bounce 10s infinite;
        transition: top 10s linear, left 10s linear;
      }
      
      @keyframes dvd-bounce {
        0% {
          top: 20%;
        }
        
        50% {
          top: 80%;
        }
        
        100% {
          top: 20%;
        }
      }
      
      #newGameButton {
        margin-top: 10px;
      }
      
      .show {
        display: block;
      }
      
      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="scoreWrap">
      <div id="scoreBar">
        &nbsp;
      </div>
    </div>
    
    <div id="overlayMessageWrap">
      <div id="overlayMessage"></div>
      <div id="newGameButton" class="centered hide">
        <button onclick="window.location.reload();">Restart Game</button>
      </div>
    </div>
    
    <details id="configOuter">
      <summary>Configuration and Setup</summary>
      <div id="configWrap">
        <b>Map Size</b><br/>
        <label>
          Width:
          <input id="mapWidthIn"></input>
        </label>
        <label>
          Height:
          <input id="mapHeightIn"></input>
        </label>
      </div>
    </details>
    
    <div id="map">
      <div class="centered doll">
        <img id="dollHead" src="blueman/doll-head.png" draggable="false" class="dollDrop" style="top: 0; left: 128px;"></img>
        <img id="dollArmPort" src="blueman/doll-arm-port.png" draggable="false" class="dollDrop" style="top: 85px; left: 30px;"></img>
        <img id="dollTorso" src="blueman/doll-torso.png" draggable="false" class="dollDrop" style="top: 76px; left: 117px;"></img>
        <img id="dollArmStarboard" src="blueman/doll-arm-starboard.png" draggable="false" class="dollDrop" style="top: 85px; left: 199px;"></img>
        <img id="dollLegPort" src="blueman/doll-leg-port.png" draggable="false" class="dollDrop" style="top: 206px; left: 90px;"></img>
        <img id="dollGroin" src="blueman/doll-groin.png" draggable="false" class="dollDrop" style="top: 206px; left: 153px;"></img>
        <img id="dollLegStarboard" src="blueman/doll-leg-starboard.png" draggable="false" class="dollDrop" style="top: 206px; left: 163px;"></img>
      </div>
      <div id="infoWrap" class="centered">
        &nbsp;
      </div>
    </div>
    
    <script type="module">
      import { classList, effect, reactive, text } from 'https://cdn.jsdelivr.net/npm/supastate/dist/index.mjs';
      
      const DEBUG = new URLSearchParams(window.location.search).get("debug") ?? false;
      const BLUEMAN_DIR = "blueman/";
      const BLUEMAN_EXT = ".png";
      const START_SCORE = DEBUG ? 2 : 30;
      
      let paused = false;
      let currentZIndex = 1;
      let currentCountdown = 3;
      let scoreInterval = null; // setInterval for score countdown
      
      const state = reactive({
        mapWidth: 1000,
        mapHeight: 700,
        score: START_SCORE
      });
      const ele = {
        map: document.getElementById("map"),
        mapWidthIn: document.getElementById("mapWidthIn"),
        mapHeightIn: document.getElementById("mapHeightIn"),
        doll: document.getElementById("doll"),
        overlayMessageWrap: document.getElementById("overlayMessageWrap"),
        scoreBar: document.getElementById("scoreBar"),
      };
      // Track both the image names, and true/false if they have been detected as dropped
      // This is used for determining winning
      const dollPieces = {
        "doll-head": false,
        "doll-arm-port": false,
        "doll-torso": false,
        "doll-arm-starboard": false,
        "doll-leg-port": false,
        "doll-groin": false,
        "doll-leg-starboard": false
      };
      
      function getRandomInt(min, max) {
          return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getRandomFloat(min, max, allDecimalPlaces) {
          if (!allDecimalPlaces) {
              return parseFloat(((Math.random() * (max - min)) + min).toFixed(3));
          }
          else {
              return (Math.random() * (max - min)) + min;
          }
      }

      function getRandomBoolean() {
          return Math.random() > 0.5;
      }
      
      function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        
        return color;
      }
      
      function getRandomRGBA() {
        return `rgba(${getRandomInt(0, 255)},
                     ${getRandomInt(0, 255)},
                     ${getRandomInt(0, 255)},
                     ${getRandomFloat(0.5, 0.7)})`
      }
      
      function handleDrop(dragEvent) {
        const getKeyFromSrc = (src) => {
          return src.substring(src.lastIndexOf(BLUEMAN_DIR) + BLUEMAN_DIR.length, src.length - BLUEMAN_EXT.length);
        };
        
        const droppedOn = document.elementsFromPoint(dragEvent.event.clientX, dragEvent.event.clientY);
        
        droppedOn.forEach(dropped => {
          if (dropped.classList.contains("dollDrop")) {
            const dragRect = dragEvent.currentNode.getBoundingClientRect();
            const dropRect = dropped.getBoundingClientRect();
            const deltaX = dragRect.x - dropRect.x;
            const deltaY = dragRect.y - dropRect.y;
            
            text("#infoWrap", () => `Off By: X=${deltaX}, Y=${deltaY}`);
            
            // Penalize based on how far off the drop was
            state.score -= Math.abs(deltaX) + Math.abs(deltaY);
            
            // Track that we dropped this piece, if it matches, and then check win condition
            const dragKey = getKeyFromSrc(dragEvent.currentNode.src);
            const dropKey = getKeyFromSrc(dropped.src);
            if (dragKey === dropKey && dollPieces.hasOwnProperty(dragKey)) {
              dollPieces[dragKey] = true;
              
              if (Object.values(dollPieces).every(val => val === true)) {
                stopGame(true);
              }
            }
          }
        });
      }
      
      function createBodyPiece(imgPath) {
        const minX = ele.map.offsetLeft;
        const minY = ele.map.offsetTop;
        const maxX = minX + state.mapWidth;
        const maxY = minY + state.mapHeight;
        
        const newPiece = document.createElement("img");
        newPiece.src = imgPath;
        newPiece.draggable = false;
        newPiece.className = "piece clickable-transparency";
        newPiece.style.filter = `hue-rotate(${getRandomInt(0, 360)}deg)`;
        newPiece.style.left = getRandomInt(0, state.mapWidth) + "px";
        newPiece.style.top = getRandomInt(0, state.mapHeight) + "px";
        
        // Bound the piece to the map
        if (parseInt(newPiece.style.left) + newPiece.width > state.mapWidth) {
          newPiece.style.left = state.mapWidth - newPiece.width + "px";
        }
        if (parseInt(newPiece.style.top) + newPiece.height > state.mapHeight) {
          newPiece.style.top = state.mapHeight - newPiece.height + "px";
        }
        
        new NeoDrag.Draggable(newPiece, {
          bounds: "parent",
          onDragStart: (data) => {
            currentZIndex++;
            data.currentNode.style.zIndex = currentZIndex;
            text("#infoWrap", () => "");
          },
          // onDrag: (data) => {
          //   console.log(new Date() + ": DRAGGING", data);
          // },
          onDragEnd: (data) => {
            console.log("onDragEnd", data);
            handleDrop(data);
          },
        });
        
        ele.map.appendChild(newPiece);
      }
      
      function startGame() {
        ele.map.style.visibility = "visible";
        ele.overlayMessageWrap.style.visibility = "hidden";
        
        scoreBar.style.width = "100%";
        scoreInterval = setInterval(() => {
          if (!paused) {
            state.score--;
            text("#scoreBar", () => state.score);
            
            scoreBar.style.width = parseInt(state.score / START_SCORE * 100) + "%";
          }
        }, 1000);
      }
      
      function stopGame(didWeWinSir) {
        if (scoreInterval) {
          clearInterval(scoreInterval);
        }
        
        ele.overlayMessageWrap.style.visibility = "visible";
        
        // After the interval stops we update the page text
        setTimeout(() => {
          ele.map.style.pointerEvents = "none";
          
          state.score = null;
          text("#scoreBar", () => "");
          text("#overlayMessage", () => {
            let message = didWeWinSir ? "You won!\n" : "You lost!\n";
            message += didWeWinSir ? getWinMessage() : getLoseMessage();
            
            classList("#newGameButton", () => ({
              show: true,
              hide: false
            }));
            
            return message;
          });
        });
      }
      
      function getWinMessage() {
        // TODO Win messages randomly
        return "Everyone is proud of you";
      }
      
      function getLoseMessage() {
        // TODO Lose messages randomly
        return "lol rekt";
      }
      
      function init() {
        document.addEventListener("visibilitychange", (event) => {
          paused = !paused;
        });
        
        ele.map.style.background = `radial-gradient(circle, ${getRandomRGBA()} 0%, ${getRandomRGBA()} 100%)`;
        ele.map.style.borderColor = getRandomColor();
        
        ele.mapWidthIn.value = state.mapWidth;
        ele.mapHeightIn.value = state.mapHeight;
        ele.mapWidthIn.addEventListener("input", e => { state.mapWidth = e.target.value });
        ele.mapHeightIn.addEventListener("input", e => { state.mapHeight = e.target.value });
        
        const updateMapDimensions = () => {
          ele.map.style.width = state.mapWidth + "px";
          ele.map.style.height = state.mapHeight + "px";
        };
        updateMapDimensions();
        
        effect(() => {
          updateMapDimensions();
        });
        
        effect(() => {
          // Little -1 so the CSS transition can finish
          if (typeof state.score === 'number' &&
              state.score <= -1) {
            stopGame();
          }
        });
        
        // Setup the pieces of the blue man across the map
        Object.keys(dollPieces).forEach((piece) => {
          createBodyPiece(`${BLUEMAN_DIR}${piece}${BLUEMAN_EXT}`);
        });
        
        // Start the countdown
        if (DEBUG) {
          startGame();
        }
        else {
          text("#overlayMessage", () => currentCountdown);
          const countdownInterval = setInterval(() => {
            currentCountdown--;
            
            if (currentCountdown <= 0) {
              startGame();
              
              if (countdownInterval) {
                clearInterval(countdownInterval);
              }
            }
            else {
              text("#overlayMessage", () => currentCountdown);
            }
          }, 999);
        }
      }
      
      addEventListener("DOMContentLoaded", (event) => {
        init();
        // TODO Determine if we want the PNG transparency detection
        // Downside is due to CORS for off-screen canvas/images we can't run as file:// and need to host
        // setupDetectTransparencyImage();
      });      
    </script>
  </body>
</html>
